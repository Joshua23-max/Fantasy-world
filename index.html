<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aetheria — Reborn in Another World</title>
<style>
:root{
  --bg:#0a0612;
  --bg2:#140b26;
  --panel:rgba(28,16,48,.72);
  --panel-solid:#1a1030;
  --gold:#e8c874;
  --gold-dim:#a98a45;
  --text:#ece6f8;
  --muted:#9f92c2;
  --accent:#8b5cf6;
  --accent2:#c084fc;
  --ok:#4ade80;
  --danger:#f2545b;
  --border:rgba(232,200,116,.22);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* animated fantasy backdrop */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%, rgba(139,92,246,.28), transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 15%, rgba(192,132,252,.20), transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(232,200,116,.10), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 68% 12%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 42% 68%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 88% 52%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 25% 88%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 78% 82%, rgba(255,255,255,.4), transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.9}}

.app{
  height:100dvh;display:flex;flex-direction:column;
  max-width:900px;margin:0 auto;
}

/* ---------- HEADER ---------- */
header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(20,11,38,.95),rgba(20,11,38,.55));
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{
  font-family:Georgia,'Times New Roman',serif;
  font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 0 18px rgba(232,200,116,.5);
  white-space:nowrap;
}
.brand small{display:block;font-size:.55rem;letter-spacing:.3em;color:var(--muted);text-shadow:none}
header .spacer{flex:1}
select,button,input,textarea{font-family:inherit;color:inherit}
select#charSelect{
  background:var(--panel-solid);border:1px solid var(--border);
  border-radius:10px;padding:7px 10px;font-size:.82rem;
  color:var(--gold);cursor:pointer;outline:none;max-width:190px;
}
.icon-btn{
  background:var(--panel-solid);border:1px solid var(--border);
  border-radius:10px;width:38px;height:38px;font-size:1rem;
  cursor:pointer;display:grid;place-items:center;
  transition:.18s;flex-shrink:0;
}
.icon-btn:hover{border-color:var(--gold);background:#241640;transform:translateY(-1px)}
.icon-btn.active{background:linear-gradient(135deg,#6d28d9,#a855f7);border-color:var(--accent2)}

/* ---------- HUD ---------- */
.hud{
  display:flex;gap:8px;padding:8px 14px;
  background:rgba(15,8,28,.6);border-bottom:1px solid rgba(232,200,116,.12);
  font-size:.72rem;letter-spacing:.05em;overflow-x:auto;scrollbar-width:none;
}
.hud::-webkit-scrollbar{display:none}
.stat{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);
  border-radius:8px;padding:4px 10px;white-space:nowrap;
}
.stat .lbl{color:var(--muted);text-transform:uppercase;font-size:.62rem}
.stat .val{font-weight:700;font-family:ui-monospace,monospace}
.bar{width:52px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.hp i{background:linear-gradient(90deg,#f2545b,#ff8a8f)}
.mp i{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.gold .val{color:var(--gold)}

/* ---------- CHAT ---------- */
#chat{
  flex:1;overflow-y:auto;padding:18px 14px 8px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}
#chat::-webkit-scrollbar{width:6px}
#chat::-webkit-scrollbar-thumb{background:rgba(232,200,116,.25);border-radius:3px}

.msg{display:flex;gap:10px;max-width:100%;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  display:grid;place-items:center;font-size:1.05rem;
  background:linear-gradient(135deg,#2a1a4a,#3d2568);
  border:1px solid var(--border);
  box-shadow:0 0 14px rgba(139,92,246,.3);
}
.msg.user .avatar{background:linear-gradient(135deg,#312254,#4c2f80)}
.bubble{
  padding:11px 15px;border-radius:var(--radius);
  line-height:1.62;font-size:.93rem;
  max-width:min(78%,620px);
  background:var(--panel);
  border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(10px);
  word-wrap:break-word;
}
.msg.assistant .bubble{
  border-left:2px solid var(--gold-dim);
  border-top-left-radius:4px;
}
.msg.user .bubble{
  background:linear-gradient(135deg,rgba(109,40,217,.55),rgba(147,51,234,.38));
  border-color:rgba(192,132,252,.35);
  border-top-right-radius:4px;
}
.bubble strong{color:var(--gold)}
.bubble em{color:var(--accent2);font-style:italic}
.bubble pre{
  background:rgba(0,0,0,.45);padding:9px;border-radius:8px;
  overflow-x:auto;font-size:.8rem;margin:6px 0;
}
.bubble .speaker{
  display:block;font-family:Georgia,serif;color:var(--gold);
  font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:5px;opacity:.85;
}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{
  width:7px;height:7px;border-radius:50%;background:var(--gold-dim);
  animation:blink 1.3s infinite;
}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ---------- QUICK ACTIONS ---------- */
.quick{
  display:flex;gap:7px;padding:6px 14px 0;overflow-x:auto;
  scrollbar-width:none;flex-shrink:0;
}
.quick::-webkit-scrollbar{display:none}
.chip{
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:999px;padding:6px 13px;font-size:.75rem;
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:.18s;
}
.chip:hover{color:var(--gold);border-color:var(--gold);background:rgba(232,200,116,.1)}

/* ---------- COMPOSER ---------- */
footer{
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(20,11,38,.98),rgba(20,11,38,.6));
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
}
.composer{display:flex;gap:8px;align-items:flex-end}
#input{
  flex:1;resize:none;min-height:44px;max-height:130px;
  background:var(--panel-solid);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;font-size:.92rem;
  outline:none;transition:.2s;line-height:1.4;
}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
#input::placeholder{color:#6b5d8c}
.send-btn{
  width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#c084fc);
  color:#fff;font-size:1.1rem;display:grid;place-items:center;
  transition:.18s;box-shadow:0 4px 18px rgba(124,58,237,.4);flex-shrink:0;
}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(124,58,237,.55)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#micBtn{width:46px;height:46px;border-radius:14px;font-size:1.15rem}
#micBtn.listening{
  background:linear-gradient(135deg,#dc2626,#f87171);
  border-color:#f87171;animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(248,113,113,.6)}
  70%{box-shadow:0 0 0 14px rgba(248,113,113,0)}
  100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}
}

/* ---------- MODAL ---------- */
.modal{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(5,2,12,.82);backdrop-filter:blur(6px);
  padding:20px;overflow-y:auto;
}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal-box{
  background:linear-gradient(160deg,#1e1236,#150c28);
  border:1px solid var(--border);border-radius:20px;
  padding:24px;width:100%;max-width:480px;
  box-shadow:0 24px 70px rgba(0,0,0,.7);
  animation:rise .3s ease both;
  max-height:90dvh;overflow-y:auto;
}
.modal-box h2{
  font-family:Georgia,serif;color:var(--gold);
  font-size:1.15rem;letter-spacing:.1em;margin-bottom:18px;
  text-transform:uppercase;
}
.field{margin-bottom:14px}
.field label{
  display:block;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.field input[type=text],.field input[type=password],.field input[type=number],.field select{
  width:100%;background:#0f0820;border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 12px;font-size:.85rem;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field .hint{font-size:.68rem;color:#6b5d8c;margin-top:5px;line-height:1.4}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.85rem}
.switch input{width:auto;accent-color:var(--accent);width:18px;height:18px;cursor:pointer}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:11px;border-radius:11px;border:1px solid var(--border);
  background:transparent;cursor:pointer;font-size:.85rem;transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none;color:#fff;font-weight:600;
}
.btn.danger{color:var(--danger);border-color:rgba(242,84,91,.4)}
.btn.danger:hover{background:rgba(242,84,91,.12)}

.listening-badge{
  display:none;position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:rgba(220,38,38,.92);padding:7px 16px;border-radius:999px;
  font-size:.75rem;letter-spacing:.08em;z-index:50;
  box-shadow:0 4px 20px rgba(220,38,38,.5);animation:pulse 1.4s infinite;
}
.listening-badge.show{display:block}

@media(max-width:600px){
  .brand{font-size:.88rem}
  .brand small{display:none}
  select#charSelect{max-width:120px;font-size:.75rem}
  .bubble{max-width:84%;font-size:.9rem}
  .msg .avatar{width:30px;height:30px;font-size:.9rem}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">✦ Aetheria <small>Reborn</small></div>
    <div class="spacer"></div>
    <select id="charSelect" title="Who are you talking to?"></select>
    <button class="icon-btn" id="newGameBtn" title="New Game">⟳</button>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
  </header>

  <div class="hud" id="hud">
    <div class="stat hp"><span class="lbl">HP</span><span class="bar"><i id="hpBar" style="width:100%"></i></span><span class="val" id="hpVal">100</span></div>
    <div class="stat mp"><span class="lbl">MP</span><span class="bar"><i id="mpBar" style="width:80%"></i></span><span class="val" id="mpVal">40</span></div>
    <div class="stat gold"><span class="lbl">Gold</span><span class="val" id="goldVal">0</span></div>
  </div>

  <main id="chat"></main>

  <div class="quick" id="quick"></div>

  <footer>
    <div class="composer">
      <button class="icon-btn" id="micBtn" title="Hold a conversation by voice">🎤</button>
      <textarea id="input" rows="1" placeholder="Speak, or type your action…"></textarea>
      <button class="send-btn" id="sendBtn" title="Send">➤</button>
    </div>
  </footer>
</div>

<div class="listening-badge" id="listenBadge">● LISTENING…</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙ Settings</h2>

    <div class="field">
      <label>API Base URL</label>
      <input type="text" id="setBaseUrl" placeholder="https://api.openai.com/v1" />
      <div class="hint">Use <code>/api</code> if you're running the included proxy server (keeps your key secret).</div>
    </div>

    <div class="field">
      <label>API Key</label>
      <input type="password" id="setApiKey" placeholder="sk-..." />
      <div class="hint">Stored only in your browser's localStorage. Never commit it.</div>
    </div>

    <div class="field">
      <label>Model</label>
      <input type="text" id="setModel" placeholder="gpt-4o-mini" />
      <div class="hint">Any OpenAI-compatible model: gpt-4o-mini, llama-3.3-70b, mistral-large…</div>
    </div>

    <div class="field">
      <label>Temperature — <span id="tempVal">0.9</span></label>
      <input type="range" id="setTemp" min="0" max="1.5" step="0.05" value="0.9" />
    </div>

    <div class="field">
      <label class="switch"><input type="checkbox" id="setTts" checked /> Voice narration (text-to-speech)</label>
    </div>

    <div class="field">
      <label>Voice</label>
      <select id="setVoice"><option value="">Default</option></select>
    </div>

    <div class="row">
      <div class="field">
        <label>Speed — <span id="rateVal">1.0</span></label>
        <input type="range" id="setRate" min="0.5" max="1.6" step="0.05" value="1" />
      </div>
      <div class="field">
        <label>Pitch — <span id="pitchVal">1.0</span></label>
        <input type="range" id="setPitch" min="0.5" max="1.8" step="0.05" value="1" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn danger" id="exportBtn">Export</button>
      <button class="btn primary" id="saveSettings">Save</button>
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn" id="closeSettings">Close</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   AETHERIA — Voice Fantasy RPG Chatbot
   ========================================================= */

/* ---------- CHARACTERS ---------- */
const CHARACTERS = {
  elara: {
    name: "Princess Elara",
    avatar: "👑",
    voice: { rate: 1.0, pitch: 1.18 },
    prompt: `You are Princess Elara Valdris of the Kingdom of Aetheria, and you are the narrator of a fantasy roleplay.

SETTING: The Player died in their old world and was reborn into Aetheria. Minutes ago they woke in a mossy forest clearing in a body that is not their own. A goblin raiding party attacked. You, Princess Elara — 22 years old, silver-haired, emerald-eyed, wielding a moonsteel saber — cut them down and dragged the Player into a hollow beneath a fallen oak. You are crouched beside them now, breathing hard, blood on your sleeve that isn't yours.

YOUR ROLE: Play Elara and act as narrator for the world around her. Describe scenes with vivid sensory detail — pine resin, cold iron, distant war-drums, the taste of copper in the air. Give the Player real choices with real consequences.

RULES:
- Always stay in character. Never mention being an AI, a model, or a prompt.
- Address the Player as "you". Use second person for narration, first person for Elara's dialogue.
- Keep replies to 2–4 short paragraphs. End with a hook, a question, or a tense beat.
- React logically and emotionally to the Player's actions. Reckless actions have consequences. Kindness is remembered.
- Elara is capable and guarded, quietly kind — never a damsel, never helpless.
- Aetheria is dangerous and grounded: magic is rare, wounds get infected, nights are cold.
- When it makes sense, end your reply with a single hidden line exactly like: [STATS hp=100 mp=40 gold=0]. Never explain it.`
  },

  narrator: {
    name: "The World Weaver",
    avatar: "🌌",
    voice: { rate: 0.94, pitch: 0.85 },
    prompt: `You are the World Weaver — the omniscient narrator and game master of the fantasy world of Aetheria.

The Player was reborn into this world and was rescued from goblins by Princess Elara Valdris. You narrate everything: the world, NPCs, weather, monsters, politics, and consequences.

RULES:
- Never speak as a character directly unless quoting them. You are the world itself.
- Vivid, literary, sensory prose. 2–4 paragraphs per reply.
- Present the Player with meaningful choices and let actions have weight.
- Never mention being an AI or a model. Never break immersion.
- End with a single hidden line when relevant: [STATS hp=100 mp=40 gold=0]`
  },

  grukk: {
    name: "Grukk, Goblin Chief",
    avatar: "👺",
    voice: { rate: 1.05, pitch: 0.7 },
    prompt: `You are Grukk, Chief of the Bonechew goblin tribe of Aetheria — the goblin who led the raid that Princess Elara interrupted.

You are crude, cunning, cowardly when losing and cruel when winning. You speak in broken, guttural Common with third-person self-reference ("Grukk not stupid!"). You hate Elara. You are also, secretly, terrified of the thing the Player might be.

The Player was reborn into Aetheria and escaped your raid.

RULES:
- Stay in character at all times. Never mention being an AI.
- Keep replies to 1–3 short paragraphs, threatening and darkly comedic.
- React to the Player's words with goblin logic: greed, fear, grudges, bargains.
- When relevant, end with: [STATS hp=100 mp=40 gold=0]`
  }
};

/* ---------- QUICK ACTIONS ---------- */
const QUICK = [
  "Look around the hollow",
  "Ask Elara who she is",
  "Check my new body",
  "Draw a weapon",
  "Try to stand up",
  "Listen to the forest"
];

/* ---------- STATE ---------- */
const STORE_KEY = "aetheria_save_v1";
let state = {
  currentChar: "elara",
  histories: {},            // charId -> [{role, content}]
  stats: { hp: 100, mp: 40, gold: 0 },
  settings: {
    baseUrl: "https://api.openai.com/v1",
    apiKey: "",
    model: "gpt-4o-mini",
    temperature: 0.9,
    tts: true,
    voiceURI: "",
    rate: 1,
    pitch: 1
  }
};
let isStreaming = false;
let recognition = null;
let isListening = false;

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const chatEl = $("chat");
const inputEl = $("input");
const sendBtn = $("sendBtn");
const micBtn = $("micBtn");
const charSelect = $("charSelect");
const hud = $("hud");

/* =========================================================
   PERSISTENCE
   ========================================================= */
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    state = {
      ...state,
      ...parsed,
      settings: { ...state.settings, ...(parsed.settings || {}) },
      stats: { ...state.stats, ...(parsed.stats || {}) },
      histories: parsed.histories || {}
    };
  } catch (e) { console.warn("Load failed", e); }
}

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function stripStats(text) {
  return String(text).replace(/\[STATS[^\]]*\]/gi, "").trim();
}

function parseStats(text) {
  const m = String(text).match(/\[STATS([^\]]*)\]/i);
  if (!m) return null;
  const out = {};
  m[1].trim().split(/\s+/).forEach(pair => {
    const [k, v] = pair.split("=");
    if (k && v !== undefined) out[k.trim().toLowerCase()] = v.trim();
  });
  return out;
}

function formatContent(text) {
  let t = escapeHtml(stripStats(text));
  t = t.replace(/
